<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>果冻记</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
  <!-- 主题：docsify 官方 vue 主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* ===== Giscus 评论区容器间距 ===== */
    #giscus-container { margin-top: 2rem; }

    /* ===== 不蒜子访客统计页脚（页面最底部，非悬浮） ===== */
    .site-stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0 8px;
      margin-top: 3rem;
      padding: 16px 0;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
    }
    /* JS 填充数字前先隐藏容器，避免闪一下空文字 */
    #busuanzi_container_site_uv, #busuanzi_container_site_pv, #busuanzi_container_page_pv { display: none; }

    /* ===== 悬浮 TOC（右侧文章目录，支持 h2~h6 五级标签）===== */
    .floating-toc {
      position: fixed;
      top: 160px;
      right: 16px;
      width: 240px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.7;
      display: none;
      z-index: 50;
      scrollbar-width: thin;
    }
    .floating-toc.visible { display: block; }
    .floating-toc .toc-item {
      display: block;
      color: #999;
      text-decoration: none;
      padding: 1px 0 1px 10px;
      border-left: 2px solid transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .2s, border-color .2s;
    }
    /* 各级标题缩进（h2 不缩进，h3~h6 逐级 +14px） */
    .floating-toc .toc-l3 { padding-left: 24px; }
    .floating-toc .toc-l4 { padding-left: 38px; font-size: 12.5px; }
    .floating-toc .toc-l5 { padding-left: 52px; font-size: 12px; }
    .floating-toc .toc-l6 { padding-left: 66px; font-size: 12px; }
    /* 悬停与当前滚动位置高亮 */
    .floating-toc .toc-item:hover,
    .floating-toc .toc-item.active {
      color: #42b983;
    }
    .floating-toc .toc-item.active {
      border-left-color: #42b983;
    }
    /* 宽屏时给正文右侧留出 TOC 专属列，避免重叠 */
    @media (min-width: 1201px) {
      /* 内容区横跨全宽、高度随内容增长，页脚才能在全宽居中并排到文档最底部 */
      .content {
        left: 0;
        bottom: auto;
        height: auto;
      }
      .markdown-section {
        margin-left: 340px;   /* 300px 固定侧边栏 + 40px 间距 */
        margin-right: 280px;
      }
    }
    /* 窄屏（≤1200px）隐藏 TOC */
    @media (max-width: 1200px) {
      .floating-toc { display: none !important; }
    }

    /* ===== 相册网格（连续图片自动排成相册，点击放大由自写 lightbox 负责）===== */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin: 1.4rem 0;
    }
    .photo-gallery img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .12);
      cursor: zoom-in;
      display: block;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .photo-gallery img:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .22);
    }
    /* 窄屏减小列宽与高度，避免格子过小 */
    @media (max-width: 600px) {
      .photo-gallery { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .photo-gallery img { height: 110px; }
    }

    /* ===== 图片灯箱（自写 lightbox，点击放大，contain 适配横竖屏）=====
       高度优先适应屏幕（max-height 撑满），宽度自动；横图则宽度优先（max-width 撑满）。
       核心：max-height/max-width + width:auto/height:auto，浏览器自动 contain 缩放，
       不同尺寸图片各取最大可见尺寸，互不裁切、互不拉伸。 */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .92);
      display: none;                 /* 由 JS 切换为 flex 显示 */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
    }
    .lightbox-img {
      max-width: 95vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 0 40px rgba(0, 0, 0, .6);
      border-radius: 4px;
      cursor: default;
      transition: transform .25s ease, max-width .25s ease, max-height .25s ease;
      transform-origin: center center;
    }
    .lightbox-counter {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      letter-spacing: .05em;
      opacity: .85;
    }
    .lightbox-close {
      position: fixed;
      top: 14px;
      right: 22px;
      color: #fff;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      opacity: .8;
    }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 34px;
      cursor: pointer;
      user-select: none;
      padding: 10px 18px;
      opacity: .65;
      transition: opacity .2s;
    }
    .lightbox-nav:hover { opacity: 1; }
    .lightbox-prev { left: 8px; }
    .lightbox-next { right: 8px; }
    .lightbox-rotate {
      position: fixed;
      top: 16px;
      right: 72px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      opacity: .8;
      z-index: 10000;
      transition: opacity .2s, transform .3s ease;
    }
    .lightbox-rotate:hover { opacity: 1; transform: rotate(90deg); }
    .lightbox-rotate svg { width: 26px; height: 26px; }
  </style>
  <!-- Edit on GitHub：在每篇文章顶部显示「在 GitHub 上编辑」链接（脚本需在 config 之前加载） -->
  <script src="//cdn.jsdelivr.net/npm/docsify-edit-on-github@1.0.3/index.js"></script>
</head>
<body>
  <div id="app">加载中……</div>
  <!-- 不蒜子访客统计：全站总访客(UV)与总访问量(PV) -->
  <!-- docsify 的 .content 是 absolute 定位，body 下的静态元素排不到正文末尾，
       由「页脚归位」插件在每次切页后把本元素移动到 .content 内、正文与评论区之后 -->
<style>
    /* ===== Giscus 评论区容器间距 ===== */
    #giscus-container { margin-top: 2rem; }

    /* ===== 不蒜子访客统计页脚（页面最底部，非悬浮） ===== */
    .site-stats {
      margin-top: 3rem;
      padding: 16px 0;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
    .site-stats span { margin: 0 8px; }
    /* JS 填充数字前先隐藏容器，避免闪一下空文字 */
    #busuanzi_container_site_uv, #busuanzi_container_site_pv { display: none; }
  </style>

  <!-- 不蒜子访客统计：全站总访客(UV)与总访问量(PV)，放在 #app 外，SPA 切页不丢失 -->
  <footer class="site-stats">
    <span id="busuanzi_container_site_uv">本站总访客数：<em id="busuanzi_value_site_uv"></em></span>
    <span id="busuanzi_container_site_pv">总访问量：<em id="busuanzi_value_site_pv"></em></span>
    <span id="busuanzi_container_page_pv">本文阅读量：<em id="busuanzi_value_page_pv"></em></span>
  </footer>
  <script>
    window.$docsify = {
      /* ===== 基础配置 ===== */
      name: '🫧 果冻记',           // 侧边栏顶部站点名
      relativePath: false,          // 使用绝对路径（从仓库根目录找 md 文件）
      repo: false,                  // 不显示右上角 GitHub 仓库角标
      loadSidebar: true,            // 加载 _sidebar.md 作为侧边栏（子目录有 _sidebar.md 时优先用子目录的）
      loadNavbar: true,             // 加载 _navbar.md 作为顶部导航栏
      subMaxLevel: 1,               // 侧边栏最多自动嵌套显示到 h2 标题
      auto2top: true,               // 切换页面时自动滚动回顶部
      coverpage: true,              // 首页显示封面（_coverpage.md）
      notFoundPage: true,           // 页面不存在时显示 _404.md 而非默认报错

      /* ===== 回到顶部按钮 ===== */
      backTopConfig: {
        visibilityHeight: 300       // 页面向下滚动超过 300px 后显示按钮
      },

      /* ===== 全文搜索（docsify 官方 search 插件）===== */
      search: {
        maxAge: 86400000,           // 搜索索引缓存 24 小时
        paths: 'auto',              // 自动索引所有页面（也可指定数组）
        placeholder: '搜索文章',     // 搜索框占位文字
        noData: '找不到结果',        // 无结果时提示
        depth: 3                    // 索引标题深度到 h3
      },

      /* ===== 上一篇 / 下一篇（docsify-pagination 插件）===== */
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: false,        // 不跨章节（不同栏目之间不出现上/下一篇跳转）
        crossChapterText: false
      },

      /* ===== 字数统计与预计阅读时间（docsify-count 插件，countable.js 驱动）===== */
      count: {
        countable: true,            // 启用字数统计
        fontsize: '0.8em',
        color: 'rgb(90, 90, 90)',
        language: 'chinese'         // 中文模式（按字符数估算，显示「X 字 | Y 分钟」）
      },

      /* ===== 图片点击放大（自写 lightbox 插件，见 plugins 数组，无外部依赖）===== */

      /* ===== 代码块一键复制（docsify-copy-code 插件）===== */
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },

      /* ===== Tabs 选项卡（docsify-tabs 插件）=====
         用法：<!-- tabs:start --> ... <!-- tabs:end -->，
         每个 ### **标题** 对应一个选项卡 */
      tabs: {
        theme: 'material'           // material 风格（带底部指示条）
      },

      /* ===== 自定义插件 ===== */
      plugins: [
        /* --- Edit on GitHub：文章顶部「在 GitHub 上编辑」链接 --- */
        EditOnGithubPlugin.create(
          'https://github.com/RobinOOOooo/the-jelly-note/blob/main/',  // 仓库 blob 地址（插件自动把 /blob/ 换成 /edit/）
          null,                   // 编辑地址基底（null = 自动推导）
          '在 GitHub 上编辑'       // 链接文字
        ),

        /* --- Giscus 评论区 ---
           基于 GitHub Discussions，每篇文章一个讨论（按路由路径区分）。
           mapping 用 specific + 动态 term（而非 pathname），
           因为 docsify 是 hash 路由 SPA，pathname 始终是 /，
           用 pathname 会导致所有页面共用同一个评论区。
           需要在 GitHub 仓库开启 Discussions，并在 giscus.app 生成配置。 */
        function (hook, vm) {
          // afterEach：在每篇文章 HTML 末尾追加评论区容器
          hook.afterEach(function (html) {
            return html + '<div id="giscus-container"></div>';
          });
          // doneEach：容器渲染后注入 giscus 脚本（按当前路由设置 term）
          hook.doneEach(function () {
            var container = document.getElementById('giscus-container');
            if (!container) return;
            var term = vm.route.path;   // 如 /posts/daily/2026-sichuan-roadtrip
            // 同一页面不重复加载
            if (container.getAttribute('data-loaded-term') === term) return;
            container.setAttribute('data-loaded-term', term);
            container.innerHTML = '';
            var script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', 'RobinOOOooo/the-jelly-note');
            script.setAttribute('data-repo-id', 'R_kgDOVCPfIA');
            script.setAttribute('data-category', 'Announcements');
            script.setAttribute('data-category-id', 'DIC_kwDOVCPfIM4DHd6y');
            script.setAttribute('data-mapping', 'specific');    // 用 term 精确匹配讨论
            script.setAttribute('data-term', term);
            script.setAttribute('data-strict', '0');
            script.setAttribute('data-reactions-enabled', '1'); // 启用表情反应
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', 'bottom'); // 评论框在评论列表下方
            script.setAttribute('data-theme', 'preferred_color_scheme'); // 跟随系统深浅色
            script.setAttribute('data-lang', 'zh-CN');
            script.crossOrigin = 'anonymous';
            script.async = true;
            container.appendChild(script);
          });
        },

        /* --- 不蒜子页脚归位 ---
           docsify 的 .content 为 absolute 定位，页脚若留在 body 中排不到正文末尾。
           每次切页后把它重新插入 .content 末尾（正文 + Giscus 评论区之后）。
           闭包持有元素引用：即使 docsify 重写 DOM 将其移出文档，引用不丢，
           可再次插入，busuanzi 首次填充的数字不会丢。 */
        function (hook) {
          var footerEl = document.querySelector('.site-stats');
          hook.doneEach(function () {
            var content = document.querySelector('.content');
            if (footerEl && content && footerEl.parentElement !== content) {
              content.appendChild(footerEl);
            }
          });
        },

        /* --- 悬浮 TOC（文章目录，自写插件，无外部依赖）---
           扫描正文 h2~h6 生成右侧固定目录：
           - 标题数 < 3 时自动隐藏（短文不显示）
           - 滚动时自动高亮当前所在小节
           - 点击目录项平滑滚动定位
           - 宽屏（>1200px）正文右侧留出专属列，窄屏隐藏（见上方 CSS） */
        function (hook) {
          var tocEl = null;         // 目录容器
          var headingEls = [];      // 对应的标题元素
          var itemEls = [];         // 目录项元素

          // 首次调用时创建目录容器并挂到 body
          function ensureEl() {
            if (!tocEl) {
              tocEl = document.createElement('div');
              tocEl.className = 'floating-toc';
              document.body.appendChild(tocEl);
            }
          }

          // 页面渲染完成后重建目录
          function build() {
            ensureEl();
            var headings = document.querySelectorAll(
              '.markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6'
            );
            headingEls = [];
            itemEls = [];
            tocEl.innerHTML = '';
            // 标题太少不显示目录
            if (headings.length < 3) {
              tocEl.classList.remove('visible');
              return;
            }
            headings.forEach(function (h, i) {
              if (!h.id) {
                h.id = 'toc-' + i;  // docsify 通常已自动生成 id，兜底补一个
              }
              var level = parseInt(h.tagName.charAt(1), 10);
              var a = document.createElement('a');
              a.className = 'toc-item toc-l' + level;  // toc-l2 ~ toc-l6 控制缩进
              a.href = '#' + h.id;
              a.textContent = h.textContent;
              a.addEventListener('click', function (e) {
                e.preventDefault();
                h.scrollIntoView({ behavior: 'smooth', block: 'start' });
              });
              tocEl.appendChild(a);
              headingEls.push(h);
              itemEls.push(a);
            });
            tocEl.classList.add('visible');
            updateActive();
          }

          // 滚动时高亮当前阅读到的小节（取最后一个已滚过的标题）
          function updateActive() {
            if (!headingEls.length) return;
            var scrollY = window.scrollY || window.pageYOffset;
            var activeIdx = 0;
            for (var i = 0; i < headingEls.length; i++) {
              if (headingEls[i].offsetTop - 120 <= scrollY) {
                activeIdx = i;
              }
            }
            itemEls.forEach(function (a, i) {
              a.classList.toggle('active', i === activeIdx);
            });
          }

          // 首次挂载：创建容器 + 注册滚动监听（passive 提升滚动性能）
          hook.mounted(function () {
            ensureEl();
            window.addEventListener('scroll', updateActive, { passive: true });
          });
          // 每次页面切换后重建目录
          hook.doneEach(function () {
            setTimeout(build, 0);   // 等 DOM 更新完成
          });
        },

        /* --- 相册网格（自写插件，无外部依赖）---
           把正文中「连续、纯图片」的段落自动合并成一个 .photo-gallery 网格容器，
           形成相册效果；点击网格内图片由自写 lightbox 负责放大查看。
           - 仅合并前后相邻的纯图片段落（段落内无文字，只含 <img>）
           - 文字 + 配图的段落不合并，保持原样，避免误伤正文插图 */
        function (hook) {
          function isImageOnly(node) {
            if (!node || node.tagName !== 'P') return false;
            var imgs = node.querySelectorAll('img');
            if (!imgs.length) return false;
            var clone = node.cloneNode(true);
            Array.prototype.forEach.call(clone.querySelectorAll('img, a'), function (el) { el.remove(); });
            return clone.textContent.replace(/\s+/g, '').length === 0;
          }
          function buildGallery() {
            var section = document.querySelector('.markdown-section');
            if (!section) return;
            var nodes = Array.prototype.slice.call(section.children);
            var i = 0;
            while (i < nodes.length) {
              if (isImageOnly(nodes[i])) {
                var j = i;
                while (j + 1 < nodes.length && isImageOnly(nodes[j + 1])) j++;
                var gallery = document.createElement('div');
                gallery.className = 'photo-gallery';
                section.insertBefore(gallery, nodes[i]);
                for (var k = i; k <= j; k++) {
                  var imgs = nodes[k].querySelectorAll('img');
                  for (var m = 0; m < imgs.length; m++) {
                    gallery.appendChild(imgs[m]);
                  }
                }
                for (var k = i; k <= j; k++) {
                  if (nodes[k].parentNode) section.removeChild(nodes[k]);
                }
                i = j + 1;
              } else {
                i++;
              }
            }
          }
          hook.doneEach(function () { setTimeout(buildGallery, 0); });
        },

        /* --- 图片灯箱（自写 lightbox，无外部依赖）---
           点击正文任意图片弹出全屏灯箱：contain 适配（高度优先撑满屏幕、宽度自动，
           横图则宽度优先），横竖屏不同尺寸都取最大可见尺寸；支持 ← → 切换、ESC / 点遮罩关闭。
           用 document 级事件委托，图片被相册插件移动后仍可命中。 */
        function (hook) {
          var overlay, imgEl, counter, items = [], idx = 0, rotation = 0;

          function build() {
            overlay = document.createElement('div');
            overlay.className = 'lightbox-overlay';
            imgEl = document.createElement('img');
            imgEl.className = 'lightbox-img';
            counter = document.createElement('div');
            counter.className = 'lightbox-counter';
            var closeBtn = document.createElement('span');
            closeBtn.className = 'lightbox-close';
            closeBtn.innerHTML = '&times;';
            var prevBtn = document.createElement('span');
            prevBtn.className = 'lightbox-nav lightbox-prev';
            prevBtn.innerHTML = '&#10094;';
            var nextBtn = document.createElement('span');
            nextBtn.className = 'lightbox-nav lightbox-next';
            nextBtn.innerHTML = '&#10095;';
            var rotateBtn = document.createElement('span');
            rotateBtn.className = 'lightbox-rotate';
            rotateBtn.title = '旋转';
            rotateBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>';
            overlay.appendChild(imgEl);
            overlay.appendChild(counter);
            overlay.appendChild(closeBtn);
            overlay.appendChild(prevBtn);
            overlay.appendChild(nextBtn);
            overlay.appendChild(rotateBtn);
            document.body.appendChild(overlay);

            overlay.addEventListener('click', function (e) {
              // 点遮罩空白处或关闭按钮 → 关闭；点图片本身不关闭（下方 stopPropagation）
              if (e.target === overlay || e.target === closeBtn) closeLb();
            });
            imgEl.addEventListener('click', function (e) { e.stopPropagation(); });
            prevBtn.addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
            nextBtn.addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });
            rotateBtn.addEventListener('click', function (e) { e.stopPropagation(); rotate(); });
            document.addEventListener('keydown', function (e) {
              if (overlay.style.display === 'none') return;
              if (e.key === 'Escape') closeLb();
              else if (e.key === 'ArrowLeft') show(idx - 1);
              else if (e.key === 'ArrowRight') show(idx + 1);
            });
          }

          function collect() {
            return Array.prototype.slice.call(document.querySelectorAll('.markdown-section img'));
          }

          function openLb(src) {
            items = collect();
            idx = 0;
            for (var i = 0; i < items.length; i++) {
              if (items[i].src === src) { idx = i; break; }
            }
            show(idx);
            overlay.style.display = 'flex';
          }

          function show(i) {
            if (!items.length) return;
            idx = (i + items.length) % items.length;
            imgEl.src = items[idx].src;
            rotation = 0;
            imgEl.style.transition = '';            // 恢复静态过渡
            if (imgEl.complete && imgEl.naturalWidth) applyGeom();
            else imgEl.onload = applyGeom;
            counter.textContent = (idx + 1) + ' / ' + items.length;
          }

          // contain 适配：0/180 按原比例，90/270 视觉宽高互换，均按 contain 取最大可见尺寸
          function applyGeom() {
            var iw = imgEl.naturalWidth, ih = imgEl.naturalHeight;
            if (!iw || !ih) return;
            var vw = window.innerWidth * 0.95, vh = window.innerHeight * 0.92;
            var s = (rotation % 180 === 0)
              ? Math.min(vw / iw, vh / ih)            // 0/180: 视觉宽=iw、高=ih
              : Math.min(vw / ih, vh / iw);            // 90/270: 视觉宽=ih、高=iw
            imgEl.style.maxWidth = (iw * s) + 'px';
            imgEl.style.maxHeight = (ih * s) + 'px';
            imgEl.style.transform = 'rotate(' + rotation + 'deg)';
          }

          // 点击旋转按钮：每次顺时针转 90 度，停在当前角度
          function rotate() {
            rotation = (rotation + 90) % 360;
            applyGeom();
          }

          function closeLb() {
            overlay.style.display = 'none';
          }

          hook.mounted(function () {
            build();
            // 事件委托：点击正文图片即放大，无需随页面重建
            document.addEventListener('click', function (e) {
              var t = e.target;
              if (t && t.tagName === 'IMG' && t.closest('.markdown-section')) {
                e.preventDefault();
                openLb(t.src);
              }
            });
          });
        },
      ]
    };
  </script>

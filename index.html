<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>果冻记</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    #giscus-container { margin-top: 2rem; }
    .floating-toc {
      position: fixed;
      top: 160px;
      right: 16px;
      width: 240px;
      max-height: calc(100vh - 220px);
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.7;
      display: none;
      z-index: 50;
      scrollbar-width: thin;
    }
    .floating-toc.visible { display: block; }
    .floating-toc .toc-item {
      display: block;
      color: #999;
      text-decoration: none;
      padding: 1px 0 1px 10px;
      border-left: 2px solid transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .2s, border-color .2s;
    }
    .floating-toc .toc-l3 { padding-left: 24px; }
    .floating-toc .toc-l4 { padding-left: 38px; font-size: 12.5px; }
    .floating-toc .toc-l5 { padding-left: 52px; font-size: 12px; }
    .floating-toc .toc-l6 { padding-left: 66px; font-size: 12px; }
    .floating-toc .toc-item:hover,
    .floating-toc .toc-item.active {
      color: #42b983;
    }
    .floating-toc .toc-item.active {
      border-left-color: #42b983;
    }
    @media (min-width: 1201px) {
      .markdown-section {
        margin-left: 40px;
        margin-right: 280px;
      }
    }
    @media (max-width: 1200px) {
      .floating-toc { display: none !important; }
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/docsify-edit-on-github@1.0.3/index.js"></script>
</head>
<body>
  <div id="app">加载中……</div>
  <script>
    window.$docsify = {
      name: '🫧 果冻记',
      relativePath: false,
      repo: false,
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 1,
      auto2top: true,
      coverpage: true,
      notFoundPage: true,
      backTopConfig: {
        visibilityHeight: 300
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文章',
        noData: '找不到结果',
        depth: 3
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: false,
        crossChapterText: false
      },
      count: {
        countable: true,
        fontsize: '0.8em',
        color: 'rgb(90, 90, 90)',
        language: 'chinese'
      },
      zoomImage: true,
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      tabs: {
        theme: 'material'
      },
      plugins: [
        EditOnGithubPlugin.create(
          'https://github.com/RobinOOOooo/the-jelly-note/blob/main/',
          null,
          '在 GitHub 上编辑'
        ),
        function (hook, vm) {
          hook.afterEach(function (html) {
            return html + '<div id="giscus-container"></div>';
          });
          hook.doneEach(function () {
            var container = document.getElementById('giscus-container');
            if (!container) return;
            var term = vm.route.path;
            if (container.getAttribute('data-loaded-term') === term) return;
            container.setAttribute('data-loaded-term', term);
            container.innerHTML = '';
            var script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', 'RobinOOOooo/the-jelly-note');
            script.setAttribute('data-repo-id', 'R_kgDOVCPfIA');
            script.setAttribute('data-category', 'Announcements');
            script.setAttribute('data-category-id', 'DIC_kwDOVCPfIM4DHd6y');
            script.setAttribute('data-mapping', 'specific');
            script.setAttribute('data-term', term);
            script.setAttribute('data-strict', '0');
            script.setAttribute('data-reactions-enabled', '1');
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', 'bottom');
            script.setAttribute('data-theme', 'preferred_color_scheme');
            script.setAttribute('data-lang', 'zh-CN');
            script.crossOrigin = 'anonymous';
            script.async = true;
            container.appendChild(script);
          });
        },
        function (hook) {
          var tocEl = null;
          var headingEls = [];
          var itemEls = [];
          function ensureEl() {
            if (!tocEl) {
              tocEl = document.createElement('div');
              tocEl.className = 'floating-toc';
              document.body.appendChild(tocEl);
            }
          }
          function build() {
            ensureEl();
            var headings = document.querySelectorAll(
              '.markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6'
            );
            headingEls = [];
            itemEls = [];
            tocEl.innerHTML = '';
            if (headings.length < 3) {
              tocEl.classList.remove('visible');
              return;
            }
            headings.forEach(function (h, i) {
              if (!h.id) {
                h.id = 'toc-' + i;
              }
              var level = parseInt(h.tagName.charAt(1), 10);
              var a = document.createElement('a');
              a.className = 'toc-item toc-l' + level;
              a.href = '#' + h.id;
              a.textContent = h.textContent;
              a.addEventListener('click', function (e) {
                e.preventDefault();
                h.scrollIntoView({ behavior: 'smooth', block: 'start' });
              });
              tocEl.appendChild(a);
              headingEls.push(h);
              itemEls.push(a);
            });
            tocEl.classList.add('visible');
            updateActive();
          }
          function updateActive() {
            if (!headingEls.length) return;
            var scrollY = window.scrollY || window.pageYOffset;
            var activeIdx = 0;
            for (var i = 0; i < headingEls.length; i++) {
              if (headingEls[i].offsetTop - 120 <= scrollY) {
                activeIdx = i;
              }
            }
            itemEls.forEach(function (a, i) {
              a.classList.toggle('active', i === activeIdx);
            });
          }
          hook.mounted(function () {
            ensureEl();
            window.addEventListener('scroll', updateActive, { passive: true });
          });
          hook.doneEach(function () {
            setTimeout(build, 0);
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-back-to-top@0.0.1/dist/docsify-back-to-top.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1.6.3/dist/docsify-tabs.min.js"></script>
</body>
</html>
